# Kiowy PR validation for the kiowy/release-1.13 maintenance branch and its
# backport/* branches.
#
# Security posture:
#   - Triggered only by `pull_request` (never `pull_request_target`), so it
#     always runs with the permissions/secrets of the PR's own head, never
#     the base repo's secrets, and untrusted forks cannot escalate.
#   - No secrets are read anywhere in this workflow.
#   - Top-level permissions are read-only; nothing here can push branches,
#     tags, packages, or releases.
name: Kiowy CI

on:
  pull_request:
    branches:
      - kiowy/release-1.13
      - "backport/**"

permissions:
  contents: read

concurrency:
  group: kiowy-ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.1.0
        with:
          go-version-file: go.mod
      - run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.1.0
        with:
          go-version-file: go.mod
      - run: make lint

  verify-generated:
    name: Verify generated files & modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.1.0
        with:
          go-version-file: go.mod
      - run: make verify

  build-image:
    name: Container build validation (amd64 + arm64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.9.0
      - name: Build (validation only, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            ARCH=amd64
